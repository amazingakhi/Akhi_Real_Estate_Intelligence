[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 10
port = 8501

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0ea5e9"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#1e293b"
font = "'DM Sans':https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"

# Semantic colors
greenColor = "#22c55e"
redColor = "#ef4444"
yellowColor = "#f59e0b"
orangeColor = "#f97316"
blueColor = "#0ea5e9"
violetColor = "#8b5cf6"
grayColor = "#64748b"

# Chart colors
chartCategoricalColors = [
    "#0ea5e9",
    "#22c55e",
    "#8b5cf6",
    "#ef4444",
    "#f59e0b",
    "#06b6d4",
    "#64748b",
    "#f97316",
]

# Sequential colors
chartSequentialColors = [
    "#f0f9ff",
    "#e0f2fe",
    "#bae6fd",
    "#7dd3fc",
    "#38bdf8",
    "#0ea5e9",
    "#0284c7",
    "#0369a1",
    "#075985",
    "#0c4a6e",
]

# Dataframe styling
dataframeBorderColor = "#e2e8f0"
dataframeHeaderBackgroundColor = "#f1f5f9"

# Sidebar
[theme.sidebar]
backgroundColor = "#f1f5f9"
secondaryBackgroundColor = "#ffffff"
codeBackgroundColor = "#f1f5f9"
textColor = "#1e293b"
borderColor = "#cbd5e1"
primaryColor = "#0ea5e9"

[runner]
# Prevents Streamlit from re-running on every keystroke in text inputs
fastReruns = true
